<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Corewise">
  <!-- The mark already on the hall wall: a lit ring around a core. Referenced
       from every page since launch but never actually present, so each load
       spent a request on a 404. -->
  <rect width="32" height="32" rx="7" fill="#0B0F10"/>
  <circle cx="16" cy="16" r="9" fill="none" stroke="#C6F24E" stroke-width="2"/>
  <circle cx="16" cy="16" r="3.2" fill="#C6F24E"/>
</svg>
