<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Corewise — סיור בקמפוס | אפליקציות, AI וחינוך</title>
<meta name="description" content="סיור וירטואלי במחלקות Corewise: וידאו ופרסום, אפליקציות ומערכות, איפיון והטמעת AI, הרצאות וסדנאות, ותוכניות לבתי ספר.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@300;400;700&family=Miriam+Libre:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---- bright professional theme for the campus tour ---- */
:root, .sw-root {
  --sw-bg: #F2F2ED;
  --sw-ink: #14181C;
  --sw-ink-soft: rgba(20,24,28,.6);
  --sw-accent: #6E9B0E;
  --sw-font-display: 'Miriam Libre', sans-serif;
  --sw-font-body: 'Miriam Libre', sans-serif;
}
html, body { background: #F2F2ED; margin: 0; }

/* RTL fix: pin the copy scrim under the copy (left) */
@media (min-width: 861px) {
  .sw-copylayer::before { left: 0 !important; right: auto !important; opacity: .35; }
}

/* ---- AR glass panels ---- */
.sw-copy {
  background: rgba(255,255,255,.5);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  backdrop-filter: blur(18px) saturate(1.2);
  border: 1px solid rgba(255,255,255,.65);
  box-shadow: 0 24px 60px rgba(20,24,28,.14), inset 0 1px 0 rgba(255,255,255,.8);
  border-radius: 22px;
  padding: 26px 28px !important;
  max-width: 460px;
}
.sw-copy__title { letter-spacing: -.02em; }
.sw-copy__sub { margin: 6px 0 0; font-size: .95rem; font-weight: 700; color: var(--sw-accent); }
.sw-copy__num { font-family: 'IBM Plex Mono', monospace; }

/* stats chips */
.sw-stats { display: flex; gap: 18px; margin-top: 18px; flex-wrap: wrap; }
.sw-stat b { display: block; font-size: 1.6rem; line-height: 1.1; color: var(--sw-ink); }
.sw-stat span { font-size: .78rem; color: var(--sw-ink-soft); }

/* work cards — mini glass tiles with real screenshots */
.sw-works { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
.sw-work {
  display: flex; gap: 12px; align-items: center; text-decoration: none;
  background: rgba(255,255,255,.65);
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 14px; padding: 10px;
  transition: transform .25s, box-shadow .25s;
}
.sw-work:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(20,24,28,.16); }
.sw-work img {
  width: 128px; height: 80px; object-fit: cover; object-position: top;
  border-radius: 9px; flex: none; border: 1px solid rgba(20,24,28,.08);
}
.sw-work__meta { min-width: 0; }
.sw-work__meta b { display: block; color: var(--sw-ink); font-size: .95rem; }
.sw-work__meta span { display: block; color: var(--sw-ink-soft); font-size: .78rem; line-height: 1.45; margin-top: 2px; }
.sw-work__meta em { display: block; font-style: normal; color: var(--sw-accent); font-size: .78rem; font-weight: 700; margin-top: 4px; }

/* ---- AR holo-screens: works floating inside the scene ---- */
.sw-holo {
  position: fixed; inset: 0; z-index: 18; pointer-events: none;
  perspective: 1400px; opacity: 0;
}
.sw-holo__screen {
  position: absolute; display: block; text-decoration: none;
  width: min(40vw, 620px);
  right: 6vw; top: 13vh;
  transform:
    translate3d(calc(var(--sw-mx, 0) * -22px), calc(var(--py, 0vh) + var(--sw-my, 0) * -14px), 0)
    rotateY(9deg) rotateX(1.5deg);
  transform-style: preserve-3d;
  will-change: transform;
}
.sw-holo__screen--1 {
  width: min(30vw, 460px);
  right: 40vw; top: 40vh;
  transform:
    translate3d(calc(var(--sw-mx, 0) * -34px), calc(var(--py, 0vh) * 1.5 + var(--sw-my, 0) * -20px), 0)
    rotateY(-8deg) rotateX(1deg);
}
.sw-holo__inner {
  display: block; position: relative;
  border-radius: 16px;
  animation: holoBob 7s ease-in-out infinite;
  transition: transform .45s cubic-bezier(.2,.7,.2,1);
}
.sw-holo__screen--1 .sw-holo__inner { animation-delay: -3.2s; }
.sw-holo__screen:hover .sw-holo__inner { transform: scale(1.035) rotateY(-4deg); }
@keyframes holoBob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
.sw-holo__inner img {
  display: block; width: 100%; border-radius: 16px;
  border: 1px solid rgba(255,255,255,.85);
  box-shadow:
    0 0 0 1px color-mix(in srgb, var(--sw-accent) 30%, transparent),
    0 40px 90px rgba(20,24,28,.35),
    0 0 44px color-mix(in srgb, var(--sw-accent) 18%, transparent);
}
.sw-holo__inner::after {
  content: ""; position: absolute; inset: 0; border-radius: 16px; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.34) 0%, transparent 28%, transparent 70%, rgba(255,255,255,.14) 100%);
}
.sw-holo__chip {
  position: absolute; top: -15px; right: 16px; z-index: 2;
  font-family: 'IBM Plex Mono', monospace; font-size: .72rem; letter-spacing: .08em; direction: ltr;
  color: #fff; background: color-mix(in srgb, var(--sw-accent) 88%, #000);
  padding: 5px 13px; border-radius: 100px;
  box-shadow: 0 6px 18px rgba(20,24,28,.3);
}
.sw-holo__desc {
  position: absolute; right: 0; left: 0; bottom: 0; z-index: 1;
  font-family: 'Miriam Libre', sans-serif; font-size: .82rem; line-height: 1.5; color: #fff;
  background: linear-gradient(0deg, rgba(14,17,20,.82), rgba(14,17,20,.55) 70%, transparent);
  padding: 26px 16px 12px; border-radius: 0 0 16px 16px;
}
.sw-holo__screen.is-portrait { width: min(21vw, 310px); }
.sw-holo__screen--1.is-portrait { width: min(18vw, 260px); }
.sw-holo__lead {
  display: block; font-style: normal; font-weight: 700; font-size: .82rem;
  color: #C6F24E; margin-top: 6px;
}
.sw-holo__anchor {
  position: absolute; top: 100%; right: 22%; width: 1px; height: 16vh;
  background: linear-gradient(color-mix(in srgb, var(--sw-accent) 65%, transparent), transparent 85%);
}
.sw-holo__anchor::after {
  content: ""; position: absolute; bottom: -3px; right: -3.5px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--sw-accent);
  box-shadow: 0 0 12px var(--sw-accent);
}
.sw-holo.is-live .sw-holo__screen { pointer-events: auto; cursor: pointer; }
@media (max-width: 860px) {
  .sw-holo__screen { width: 70vw; right: 4vw; top: 9vh; }
  .sw-holo__screen--1 { width: 52vw; right: auto; left: 4vw; top: 29vh; }
  .sw-holo__screen.is-portrait { width: 38vw; }
  .sw-holo__screen--1.is-portrait { width: 32vw; }
  .sw-holo__anchor { display: none; }
  .sw-holo__desc { display: none; }
}

/* ---- VR teleport bar: jump between departments ---- */
.vr-bar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  z-index: 85; display: flex; align-items: center; gap: 4px;
  background: rgba(255,255,255,.55);
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  backdrop-filter: blur(16px) saturate(1.2);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 100px; padding: 6px;
  box-shadow: 0 16px 44px rgba(20,24,28,.18);
  font-family: 'Miriam Libre', sans-serif;
  transition: opacity .4s ease;
}
.past-world .vr-bar { opacity: 0; pointer-events: none; }
.vr-bar button {
  border: 0; cursor: pointer; font: inherit;
  background: transparent; color: #14181C;
  border-radius: 100px; padding: 9px 14px; font-weight: 700; font-size: .95rem;
  transition: background .2s;
}
.vr-bar button:hover { background: rgba(20,24,28,.07); }
.vr-bar .vr-label {
  min-width: 128px; text-align: center; font-size: .88rem; font-weight: 700; color: #14181C;
  display: flex; flex-direction: column; line-height: 1.2; gap: 1px;
}
.vr-bar .vr-label small { font-family: 'IBM Plex Mono', monospace; font-size: .62rem; color: rgba(20,24,28,.55); letter-spacing: .12em; direction: ltr; font-weight: 400; }
@media (max-width: 860px) {
  .vr-bar { bottom: max(14px, env(safe-area-inset-bottom)); width: calc(100vw - 24px); justify-content: space-between; }
  .vr-bar .vr-label { min-width: 0; flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .sw-holo__inner { animation: none; }
}

/* ---- RoomExplorer (360° VR) ---- */
.rx { position: fixed; inset: 0; z-index: 300; display: none; background: #0c0f12; }
.rx.rx-on { display: block; animation: rxIn .5s ease; }
@keyframes rxIn { from { opacity: 0 } to { opacity: 1 } }
.rx-lock, .rx-lock body { overflow: hidden !important; }
.rx-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.rx-canvas:active { cursor: grabbing; }
.rx-top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: center;
  padding: max(14px, env(safe-area-inset-top)) 18px 12px;
  background: linear-gradient(rgba(12,15,18,.55), transparent);
  font-family: 'Miriam Libre', sans-serif;
}
.rx-title { color: #fff; font-weight: 700; font-size: 1.05rem; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
.rx-actions button {
  border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.14);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  color: #fff; font-size: 1.05rem; border-radius: 100px; width: 42px; height: 42px;
  cursor: pointer; margin-right: 8px;
}
.rx-actions .rx-gyro.on { background: #6E9B0E; border-color: #6E9B0E; }
.rx-hint {
  position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  z-index: 5; color: rgba(255,255,255,.85); font-family: 'Miriam Libre', sans-serif; font-size: .85rem;
  background: rgba(12,15,18,.45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  padding: 8px 18px; border-radius: 100px; pointer-events: none;
}
.rx-load {
  position: absolute; inset: 0; display: grid; place-items: center; z-index: 4;
  color: #fff; font-family: 'Miriam Libre', sans-serif; background: #0c0f12;
}
.rx-spots { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.rx-spot {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 8px; pointer-events: auto; cursor: pointer;
  border: 0; background: transparent; font-family: 'Miriam Libre', sans-serif;
}
.rx-spot i {
  width: 18px; height: 18px; border-radius: 50%; flex: none;
  background: rgba(198,242,78,.95); border: 2px solid #fff;
  box-shadow: 0 0 0 6px rgba(198,242,78,.25), 0 0 18px rgba(198,242,78,.8);
  animation: rxPulse 2s ease-in-out infinite;
}
@keyframes rxPulse { 0%,100% { box-shadow: 0 0 0 6px rgba(198,242,78,.25), 0 0 18px rgba(198,242,78,.8) } 50% { box-shadow: 0 0 0 12px rgba(198,242,78,.1), 0 0 26px rgba(198,242,78,.9) } }
.rx-spot span {
  color: #fff; font-size: .85rem; font-weight: 700;
  background: rgba(12,15,18,.6); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  padding: 6px 13px; border-radius: 100px; white-space: nowrap;
  border: 1px solid rgba(255,255,255,.18);
}
.rx-card {
  position: absolute; z-index: 6; right: 50%; bottom: 12vh; transform: translateX(50%);
  width: min(440px, calc(100vw - 36px));
  background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-radius: 18px; padding: 22px 24px; font-family: 'Miriam Libre', sans-serif;
  box-shadow: 0 30px 80px rgba(0,0,0,.45); direction: rtl;
  animation: rxIn .35s ease;
}
.rx-card__img {
  display: block; width: calc(100% + 48px); margin: -22px -24px 14px;
  border-radius: 18px 18px 0 0; max-height: 200px; object-fit: cover; object-position: top;
}
.rx-card h3 { margin: 0 0 8px; font-size: 1.15rem; color: #14181C; }
.rx-card p { margin: 0; font-size: .95rem; line-height: 1.65; color: rgba(20,24,28,.8); }
.rx-card a { display: inline-block; margin-top: 12px; color: #6E9B0E; font-weight: 700; text-decoration: none; }
.rx-card__close {
  position: absolute; top: 10px; left: 10px; border: 0; background: rgba(20,24,28,.08);
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: #14181C;
}
/* enter-room button on glass panels */
.sw-copy__explore {
  margin-top: 14px; display: inline-flex; align-items: center; gap: 8px;
  border: 0; cursor: pointer; font-family: 'Miriam Libre', sans-serif; font-weight: 700; font-size: .95rem;
  color: #fff; background: linear-gradient(120deg, #14181C, #2a3138); border-radius: 100px; padding: 12px 24px;
  box-shadow: 0 0 0 2px rgba(110,155,14,.55), 0 10px 26px rgba(20,24,28,.22);
  transition: transform .2s, box-shadow .2s;
  animation: explorePulse 2.6s ease-in-out infinite;
}
.sw-copy__explore:hover { transform: translateY(-2px); box-shadow: 0 0 0 3px #6E9B0E, 0 14px 34px rgba(20,24,28,.3); }
@keyframes explorePulse { 0%,100% { box-shadow: 0 0 0 2px rgba(110,155,14,.55), 0 10px 26px rgba(20,24,28,.22) } 50% { box-shadow: 0 0 0 5px rgba(110,155,14,.25), 0 10px 26px rgba(20,24,28,.22) } }
/* panel must never hide its content below the fold */
.sw-copy { max-height: 76vh; overflow-y: auto; scrollbar-width: none; }
.sw-copy::-webkit-scrollbar { display: none; }

/* light topbar */
.sw-topbar {
  background: rgba(255,255,255,.55) !important;
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(20,24,28,.08);
}
.sw-topbar, .sw-topbar * { color: var(--sw-ink) !important; }
.sw-nav__item.is-active { color: #fff !important; }

/* skip-to-content pill */
.classic-link {
  position: fixed; top: 18px; left: 18px; z-index: 90;
  font-family: 'Miriam Libre', sans-serif; font-size: .82rem;
  color: rgba(20,24,28,.65); text-decoration: none;
  border: 1px solid rgba(20,24,28,.18); border-radius: 100px;
  padding: 7px 16px; backdrop-filter: blur(8px); background: rgba(255,255,255,.5);
  transition: color .2s, border-color .2s;
}
.classic-link:hover { color: #6E9B0E; border-color: #6E9B0E; }

/* content block after the tour rides above the fixed stage */
.site-after { position: relative; z-index: 150; background: #0B0E11; }
.sw-topbar, .sw-route, .sw-hint, .sw-scrollbar, .classic-link { transition: opacity .4s ease; }
.past-world .sw-topbar, .past-world .sw-route, .past-world .sw-hint,
.past-world .sw-scrollbar, .past-world .classic-link { opacity: 0 !important; pointer-events: none !important; }
</style>
</head>
<body>
<div id="top"></div>
<div id="world"></div>




<script src="explore.js"></script>
<script src="scrub-engine.js"></script>
<script>
fetch('tour-content.json?v=' + Date.now()).then(r => r.json()).then(cfg => {
  const media = {
    lobby:  { still: 'world2-build/still_0_lobby.webp',  clip: 'world2-build/vid/leg_0.mp4', clipMobile: 'world2-build/vid/leg_0-m.mp4', scroll: 1.5, linger: 0.35 },
    video:  { still: 'world2-build/still_1_video.webp',  clip: 'world2-build/vid/leg_1.mp4', clipMobile: 'world2-build/vid/leg_1-m.mp4' },
    apps:   { still: 'world2-build/still_2_apps.webp',   clip: 'world2-build/vid/leg_2.mp4', clipMobile: 'world2-build/vid/leg_2-m.mp4' },
    ai:     { still: 'world2-build/still_3_ai.webp',     clip: 'world2-build/vid/leg_3.mp4', clipMobile: 'world2-build/vid/leg_3-m.mp4' },
    stage:  { still: 'world2-build/still_4_stage.webp',  clip: 'world2-build/vid/leg_4.mp4', clipMobile: 'world2-build/vid/leg_4-m.mp4' },
    school: { still: 'world2-build/still_5_school.webp', clip: 'world2-build/vid/leg_5.mp4', clipMobile: 'world2-build/vid/leg_5-m.mp4', scroll: 1.5 },
    team:   { still: 'world2-build/still_6_team.webp',   clip: 'world2-build/vid/leg_6.mp4', clipMobile: 'world2-build/vid/leg_6-m.mp4', scroll: 1.7, linger: 0.5 },
  };
  const labels = { lobby: 'הכניסה', video: 'וידאו ופרסום', apps: 'אפליקציות', ai: 'איפיון ו-AI', stage: 'הרצאות', school: 'בתי ספר', team: 'בואו נדבר' };
  const accents = { lobby: '#6E9B0E', video: '#B4530A', apps: '#6E9B0E', ai: '#B4530A', stage: '#6E9B0E', school: '#B4530A', team: '#6E9B0E' };

  const sections = cfg.departments.map(d => {
    const s = Object.assign({}, media[d.id]);
    s.id = d.id; s.label = labels[d.id] || d.id; s.accent = accents[d.id];
    s.eyebrow = d.eyebrow; s.title = d.title; s.sub = d.sub; s.body = d.body;
    s.stats = d.stats; s.works = d.works;
    if (d.hotspots) s.explore = {
      title: d.title,
      pano: 'world2-build/pano_' + d.id + '.webp',
      hotspots: d.hotspots,
    };
    if (d.cta) s.cta = {
      primary: { label: 'וואטסאפ ללידור', href: d.cta.whatsapp },
      secondary: { label: 'lidor@corewise.co.il', href: 'mailto:lidor@corewise.co.il' },
    };
    return s;
  });

  mountScrollWorld(document.getElementById('world'), {
    brand: { name: 'corewise', href: '#top' },
    hint: 'גללו כדי להתחיל בסיור',
    nav: true,
    atmosphere: false,
    diveScroll: 1.3,
    sections,
    connectors: [],
  });

  const world = document.getElementById('world');
  const setPast = () => document.documentElement.classList.toggle('past-world', scrollY > world.offsetHeight - innerHeight * 0.6);
  addEventListener('scroll', setPast, { passive: true }); setPast();

  /* ---- VR teleport bar ---- */
  const widths = sections.map(s => s.scroll || 1.3);
  const starts = []; let acc = 0;
  widths.forEach(w => { starts.push(acc); acc += w; });
  const names = sections.map(s => s.label);

  const bar = document.createElement('div');
  bar.className = 'vr-bar';
  bar.innerHTML =
    '<button class="vr-prev" aria-label="המחלקה הקודמת">→</button>' +
    '<span class="vr-label"><span class="vr-name"></span><small class="vr-idx"></small></span>' +
    '<button class="vr-next" aria-label="המחלקה הבאה">←</button>';
  document.body.appendChild(bar);
  const nameEl = bar.querySelector('.vr-name'), idxEl = bar.querySelector('.vr-idx');

  const vh = () => window.innerHeight;
  const current = () => {
    const p = scrollY / vh();
    let c = 0;
    starts.forEach((st, i) => { if (p >= st) c = i; });
    return c;
  };
  const go = i => {
    i = Math.max(0, Math.min(sections.length - 1, i));
    window.scrollTo({ top: (starts[i] + widths[i] * 0.5) * vh(), behavior: 'smooth' });
  };
  bar.querySelector('.vr-next').addEventListener('click', () => go(current() + 1));
  bar.querySelector('.vr-prev').addEventListener('click', () => go(current() - 1));
  const refresh = () => {
    const c = current();
    nameEl.textContent = names[c];
    idxEl.textContent = (c + 1) + ' / ' + sections.length;
  };
  addEventListener('scroll', refresh, { passive: true }); refresh();
});
</script>
</body>
</html>
